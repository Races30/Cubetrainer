name: cubetrainer
description: CubeTrainer v2 - Flutter starter for Rubik's Cube scrambles/timer/stats
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  csv: ^6.0.0
  flutter_riverpod: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  fl_chart: ^1.1.1
  http: ^1.2.1
  intl: ^0.20.2
  google_generative_ai: ^0.4.7
  uuid: ^4.3.3
  riverpod_annotation: ^2.6.1
  flutter_dotenv: ^6.0.0
  wakelock_plus: ^1.2.8
  file_picker: ^10.3.8
  share_plus: ^12.0.1
  home_widget: ^0.9.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  analyzer: ^6.4.1
  riverpod_analyzer_utils: ^0.5.1
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.0
  test: ^1.26.3

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/.env
